name: Package and Release Module

on:
  workflow_dispatch:

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Joomla Extension Packager
        uses: N6REJ/joomla-packager@main
        id: package
        with:
          extension-name: 'mod_curseforge_generator'
          extension-xml: 'mod_curseforge_generator.xml'
          extension-type: 'module'
          # Feed matching: Joomla silently ignores entries missing client or
          # targetplatform.
          extension-client: 'site'
          targetplatform-name: 'joomla'
          targetplatform-version: '(5|6).*'

          author: 'N6REJ'
          copyright-holder: 'N6REJ'
          copyright-start-year: '2026'
          license-file: 'LICENSE'
          update-joomla-server: 'true'
          commit-changes: 'true'
          upload-artifact: 'false'
          ignore-docs: 'true'
          ignore-stats: 'true'
          ignore-updates-xml: 'true'
          github-token: ${{ secrets.GH_PAT }}

      - name: Upload extension package files
        uses: actions/upload-artifact@v7 # v7.0.1 (Node 24)
        with:
          name: mod_curseforge_generator_${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.package-path }}
          retention-days: 90
          if-no-files-found: warn
